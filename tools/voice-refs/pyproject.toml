[project]
name = "voicerefs"
version = "0.1.0"
description = "Matched reference clips for the breeze voice: comparison experiment"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "numpy>=1.26",
  "praat-parselmouth>=0.4.7",
  "pypinyin>=0.55.0",
  "scikit-learn>=1.7.2",
  "soundfile>=0.12",
  "speechbrain>=1.1.2",
]

[project.optional-dependencies]
laya = ["laya>=0.3.22"]

[project.scripts]
voicerefs = "voicerefs.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
